name: Blinky

on:
  workflow_dispatch:

jobs:
  build_for_hw_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: zephyrprojectrtos/ci:v0.29.3

    env:
      ZEPHYR_VERSION: v4.2.2
      ZEPHYR_TOOLCHAIN_VERSION: 0.17.0
      BOARD_TYPE: "nrf5340dk/nrf5340/cpuapp"

    steps:
      - name: Cache Zephyr workspace
        uses: actions/cache@v4
        id: zephyr-cache
        with:
          path: zephyr-workspace
          key: ${{ runner.os }}-zephyr-${{ env.ZEPHYR_VERSION }}

      - name: Fetch vanilla Zephyr
        if: steps.zephyr-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p zephyr-workspace
          git clone --depth 1 --branch $ZEPHYR_VERSION \
            https://github.com/zephyrproject-rtos/zephyr.git zephyr-workspace/zephyr
          cd zephyr-workspace
          west init -l zephyr
          west update --narrow -o=--depth=1

      - name: Cache Zephyr SDK
        uses: actions/cache@v4
        id: cache-zephyr-sdk
        with:
          path: /opt/toolchains/zephyr-sdk-${{ env.ZEPHYR_TOOLCHAIN_VERSION }}
          key: ${{ runner.os }}-zephyr-sdk-${{ env.ZEPHYR_TOOLCHAIN_VERSION }}-arm

      - name: Download & Extract Zephyr SDK
        if: steps.cache-zephyr-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/toolchains
          wget -qO- "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_TOOLCHAIN_VERSION}/zephyr-sdk-${ZEPHYR_TOOLCHAIN_VERSION}_linux-x86_64_minimal.tar.xz" | tar -xJ -C /opt/toolchains

      - name: Register SDK CMake Package
        run: |
          cd /opt/toolchains/zephyr-sdk-${ZEPHYR_TOOLCHAIN_VERSION}
          ./setup.sh -h -c -t arm-zephyr-eabi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ env.BOARD_TYPE }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.BOARD_TYPE }}-

      - name: Build blinky
        env:
          CCACHE_DIR: ~/.cache/ccache
        run: |
          cd zephyr-workspace
          west build -b $BOARD_TYPE zephyr/samples/basic/blinky -d build -p -- -DZEPHYR_SCACHE=ccache
          ccache -s || true

      - name: Create build tarball
        run: |
          cd zephyr-workspace
          tar czf build.tar.gz build/zephyr/zephyr.hex

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: build.tar.gz
          path: zephyr-workspace/build.tar.gz

  hw_flash_and_test:
    needs: build_for_hw_test
    runs-on: [self-hosted]
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: blinky-test

    env:
      CI_NRF5340DK_SNR: "1050073602"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: blinky-test

      - name: Setup USB permissions
        run: |
          sudo chmod 666 /dev/bus/usb/*/* || true
          sudo chown root:root /dev/bus/usb/*/* || true
          lsusb -v | grep -i "j-link" || true
          ls -la /dev/bus/usb/*/*

      - name: Check J-Link version
        run: |
          JLinkExe -v
          nrfjprog --version

      - name: Preflight — toolchain and probe present
        run: |
          set -euo pipefail
          nrfjprog --version
          echo "--- connected probes ---"
          nrfjprog --ids
          if ! nrfjprog --ids | grep -qx "$CI_NRF5340DK_SNR"; then
            echo "::error::J-Link $CI_NRF5340DK_SNR not found. Check USB passthrough / board power."
            exit 1
          fi

      - name: Download build tarball
        uses: actions/download-artifact@v4
        with:
          name: build.tar.gz
          path: blinky-test/samples/blinky

      - name: Untar
        run: |
          set -euo pipefail
          cd samples/blinky
          rm -rf build
          tar xzf build.tar.gz
          test -f build/zephyr/zephyr.hex

      - name: Flash
        run: |
          set -euo pipefail
          cd samples/blinky
          flash() { nrfjprog "$@" -f NRF53 --snr "$CI_NRF5340DK_SNR" --log || { echo "--- log.log ---"; cat log.log; return 1; }; }
          flash --recover
          flash --eraseall
          flash --program build/zephyr/zephyr.hex --verify
          flash --reset
          sleep 3

      - name: Leave board in a clean state
        if: always()
        run: |
          nrfjprog --reset -f NRF53 --snr "$CI_NRF5340DK_SNR" || true