            echo "Reset attempt $i"
            if nrfjprog --reset -f NRF53 --snr "$CI_NRF5340DK_SNR" 2>&1; then
              echo "Reset successful"
              break
            fi
            sleep 2
          done || true
          
          # Final attempt with J-Link direct command if nrfjprog fails
          JLinkExe -device NRF5340_XXAA -if SWD -speed 4000 -autoconnect 1 -CommanderScript <(echo "r; g; exit") 2>&1 || true