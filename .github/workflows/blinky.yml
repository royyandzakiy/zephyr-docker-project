name: Blinky

on:
  workflow_dispatch:

jobs:
  build_for_hw_test:
    runs-on: ubuntu-latest

    container:
      image: zephyrprojectrtos/ci:v0.29.3

    env:
      ZEPHYR_VERSION: v4.2.2
      ZEPHYR_TOOLCHAIN_VERSION: 0.17.0
      BOARD_TYPE: "nrf5340dk/nrf5340/cpuapp"

    steps:
      - name: Cache Zephyr workspace
        uses: actions/cache@v4
        id: zephyr-cache
        with:
          path: zephyr-workspace
          key: ${{ runner.os }}-zephyr-${{ env.ZEPHYR_VERSION }}

      - name: Fetch vanilla Zephyr
        if: steps.zephyr-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p zephyr-workspace
          git clone --depth 1 --branch $ZEPHYR_VERSION \
            https://github.com/zephyrproject-rtos/zephyr.git zephyr-workspace/zephyr
          cd zephyr-workspace
          west init -l zephyr
          west update --narrow -o=--depth=1

      - name: Cache Zephyr SDK
        uses: actions/cache@v4
        id: cache-zephyr-sdk
        with:
          path: /opt/toolchains/zephyr-sdk-${{ env.ZEPHYR_TOOLCHAIN_VERSION }}
          key: ${{ runner.os }}-zephyr-sdk-${{ env.ZEPHYR_TOOLCHAIN_VERSION }}-arm

      - name: Download & Extract Zephyr SDK
        if: steps.cache-zephyr-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/toolchains
          wget -qO- "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_TOOLCHAIN_VERSION}/zephyr-sdk-${ZEPHYR_TOOLCHAIN_VERSION}_linux-x86_64_minimal.tar.xz" | tar -xJ -C /opt/toolchains

      - name: Register SDK CMake Package
        run: |
          cd /opt/toolchains/zephyr-sdk-${ZEPHYR_TOOLCHAIN_VERSION}
          ./setup.sh -h -c -t arm-zephyr-eabi

      - name: Build blinky
        env:
          CCACHE_DIR: ~/.cache/ccache
        run: |
          cd zephyr-workspace
          west build -b $BOARD_TYPE zephyr/samples/basic/blinky -d build -p -- -DZEPHYR_SCACHE=ccache

      - name: Create build tarball
        run: |
          cd zephyr-workspace/build/zephyr
          tar czf build.tar.gz zephyr.hex

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: build.tar.gz
          path: zephyr-workspace/build/zephyr/build.tar.gz

  hw_flash_and_test:
    needs: build_for_hw_test
    runs-on: [self-hosted]

    defaults:
      run:
        shell: bash
        working-directory: blinky-test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: blinky-test

      - name: Download build tarball
        uses: actions/download-artifact@v4
        with:
          name: build.tar.gz
          path: blinky-test/samples/blinky

      - name: Untar
        run: |
          cd samples/blinky
          tar xvf build.tar.gz

      - name: Flash and Verify Test Results
        env:
          CI_NRF5340DK_SNR: 001050073602
        run: |
          cd samples/blinky
          echo $CI_NRF5340DK_SNR

          nrfjprog --recover -f NRF53 --snr $CI_NRF5340DK_SNR
          nrfjprog --eraseall -f NRF53 --snr $CI_NRF5340DK_SNR
          nrfjprog --program build/zephyr/zephyr.hex --verify -f NRF53 --snr $CI_NRF5340DK_SNR
          nrfjprog --pinresetenable -f NRF53 --snr $CI_NRF5340DK_SNR
          nrfjprog --pinreset -f NRF53 --snr $CI_NRF5340DK_SNR
          sleep 3