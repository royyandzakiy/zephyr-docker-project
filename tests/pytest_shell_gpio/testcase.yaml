tests:
  gpio.button.toggle:
    build_only: false
    harness: shell
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
    tags:
      - gpio
      - button
      - shell
    harness_config:
      shell_commands:
        - command: "test_btn"
          expected: "Button pressed! LED is now ON"
        - command: "test_btn"
          expected: "Button pressed! LED is now OFF"
        - command: "test_btn"
          expected: "Button pressed! LED is now ON"